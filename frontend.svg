 <svg width="700" height="380" viewBox="0 0 700 380"
     xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink">

  <style>
    .bg { fill:#0b1220 }
    .bar-bg { fill:#1f2937 }
    .bar { fill:#00F7FF }
    .percent { fill:#00F7FF; font:12px monospace }
  </style>

  <rect width="700" height="380" class="bg"/>

  <image x="20" y="52" width="28" height="28"
    xlink:href="https://skillicons.dev/icons?i=html"/>
  <rect x="180" y="60" width="480" height="14" rx="7" class="bar-bg"/>
  <rect x="180" y="60" height="14" rx="7" class="bar">
    <animate attributeName="width" from="0" to="408" dur="1.1s" fill="freeze"/>
  </rect>
  <text x="670" y="72" class="percent">85%</text>

  <image x="20" y="92" width="28" height="28"
    xlink:href="https://skillicons.dev/icons?i=css"/>
  <rect x="180" y="100" width="480" height="14" rx="7" class="bar-bg"/>
  <rect x="180" y="100" height="14" rx="7" class="bar">
    <animate attributeName="width" from="0" to="432" dur="1.2s" fill="freeze"/>
  </rect>
  <text x="670" y="112" class="percent">90%</text>

  <image x="20" y="132" width="28" height="28"
    xlink:href="https://skillicons.dev/icons?i=js"/>
  <rect x="180" y="140" width="480" height="14" rx="7" class="bar-bg"/>
  <rect x="180" y="140" height="14" rx="7" class="bar">
    <animate attributeName="width" from="0" to="456" dur="1.3s" fill="freeze"/>
  </rect>
  <text x="670" y="152" class="percent">95%</text>

  <image x="20" y="172" width="28" height="28"
    xlink:href="https://skillicons.dev/icons?i=react"/>
  <rect x="180" y="180" width="480" height="14" rx="7" class="bar-bg"/>
  <rect x="180" y="180" height="14" rx="7" class="bar">
    <animate attributeName="width" from="0" to="254" dur="1.4s" fill="freeze"/>
  </rect>
  <text x="670" y="192" class="percent">53%</text>

  <image x="20" y="212" width="28" height="28"
    xlink:href="https://skillicons.dev/icons?i=vue"/>
  <rect x="180" y="220" width="480" height="14" rx="7" class="bar-bg"/>
  <rect x="180" y="220" height="14" rx="7" class="bar">
    <animate attributeName="width" from="0" to="264" dur="1.5s" fill="freeze"/>
  </rect>
  <text x="670" y="232" class="percent">55%</text>

  <image x="20" y="252" width="28" height="28"
    xlink:href="https://skillicons.dev/icons?i=angular"/>
  <rect x="180" y="260" width="480" height="14" rx="7" class="bar-bg"/>
  <rect x="180" y="260" height="14" rx="7" class="bar">
    <animate attributeName="width" from="0" to="226" dur="1.6s" fill="freeze"/>
  </rect>
  <text x="670" y="272" class="percent">47%</text>

  <image x="20" y="292" width="28" height="28"
    xlink:href="https://skillicons.dev/icons?i=laravel"/>
  <rect x="180" y="300" width="480" height="14" rx="7" class="bar-bg"/>
  <rect x="180" y="300" height="14" rx="7" class="bar">
    <animate attributeName="width" from="0" to="245" dur="1.7s" fill="freeze"/>
  </rect>
  <text x="670" y="312" class="percent">51%</text>

</svg>
