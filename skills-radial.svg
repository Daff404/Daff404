<svg width="700" height="260" viewBox="0 0 700 260"
     xmlns="http://www.w3.org/2000/svg">

  <style>
    .bg { fill:#0b1220 }
    .label { fill:#9AE6F5; font:14px monospace; text-anchor:middle }
    .percent { fill:#00F7FF; font:16px monospace; text-anchor:middle }
    .track { fill:none; stroke:#1f2937; stroke-width:10 }
    .bar { fill:none; stroke:#00F7FF; stroke-width:10; stroke-linecap:round }
  </style>

  <rect width="700" height="260" class="bg"/>

  <!-- FUNCTION TEMPLATE -->
  <!-- circle length = 2πr = ~188 -->

  <!-- Automation 100% -->
  <g transform="translate(90,130)">
    <circle r="30" class="track"/>
    <circle r="30" class="bar"
      stroke-dasharray="188"
      stroke-dashoffset="188">
      <animate attributeName="stroke-dashoffset"
        from="188" to="0" dur="1.5s" fill="freeze"/>
    </circle>
    <text y="5" class="percent">100%</text>
    <text y="55" class="label">Automation</text>
  </g>

  <!-- API Engineering 100% -->
  <g transform="translate(230,130)">
    <circle r="30" class="track"/>
    <circle r="30" class="bar"
      stroke-dasharray="188"
      stroke-dashoffset="188">
      <animate attributeName="stroke-dashoffset"
        from="188" to="0" dur="1.6s" fill="freeze"/>
    </circle>
    <text y="5" class="percent">100%</text>
    <text y="55" class="label">API</text>
  </g>

  <!-- Web Development 90% -->
  <g transform="translate(370,130)">
    <circle r="30" class="track"/>
    <circle r="30" class="bar"
      stroke-dasharray="188"
      stroke-dashoffset="19">
      <animate attributeName="stroke-dashoffset"
        from="188" to="19" dur="1.7s" fill="freeze"/>
    </circle>
    <text y="5" class="percent">90%</text>
    <text y="55" class="label">Web</text>
  </g>

  <!-- Reverse Engineering 80% -->
  <g transform="translate(510,130)">
    <circle r="30" class="track"/>
    <circle r="30" class="bar"
      stroke-dasharray="188"
      stroke-dashoffset="38">
      <animate attributeName="stroke-dashoffset"
        from="188" to="38" dur="1.8s" fill="freeze"/>
    </circle>
    <text y="5" class="percent">80%</text>
    <text y="55" class="label">Reverse</text>
  </g>

  <!-- Security Mindset 90% -->
  <g transform="translate(650,130)">
    <circle r="30" class="track"/>
    <circle r="30" class="bar"
      stroke-dasharray="188"
      stroke-dashoffset="19">
      <animate attributeName="stroke-dashoffset"
        from="188" to="19" dur="1.9s" fill="freeze"/>
    </circle>
    <text y="5" class="percent">90%</text>
    <text y="55" class="label">Security</text>
  </g>

</svg>
